<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經尋寶大冒險</title>

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333;
            --muted: #777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                Arial,
                sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            padding: 20px;
            margin: auto 0;
        }

        h1 {
            font-size: 21px;
            text-align: center;
            color: var(--primary);
            margin: 0 0 18px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 18px;
        }

        .select-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            border-radius: 9px;
            border: 1px solid #ccc;
            background: #fff;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2f5;
            padding: 10px 12px;
            border-radius: 9px;
            margin-bottom: 15px;
        }

        .tokens {
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
        }

        .route-name {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .card {
            border: 2px solid var(--primary);
            border-radius: 13px;
            padding: 17px;
            background: #fff;
            margin-bottom: 15px;
        }

        .node-number {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .loc-title {
            font-size: 23px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .scenario {
            font-size: 16px;
            color: var(--text);
            line-height: 1.65;
            margin-bottom: 18px;
            text-align: left;
        }

        .choice-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        button {
            padding: 15px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.15s;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-opt {
            background-color: #3498db;
            color: white;
        }

        .btn-opt.alt {
            background-color: #e67e22;
        }

        .btn-main {
            width: 100%;
            margin-top: 15px;
            background-color: #3498db;
            color: white;
        }

        .btn-reset {
            padding: 7px 10px;
            font-size: 12px;
            background: #95a5a6;
            color: #fff;
        }

        .result {
            text-align: center;
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .result-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .result-text {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
        }

        .hidden {
            display: none;
        }

        .progress {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .progress-dot {
            height: 5px;
            flex: 1;
            background: #ddd;
            border-radius: 5px;
        }

        .progress-dot.done {
            background: #3498db;
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>⛪ 聖經尋寶大冒險</h1>

    <!-- =========================
         SETUP
    ========================== -->
    <div id="setup-screen">

        <div class="subtitle">
            選擇一條旅程，靠你哋自己揀路！
        </div>

        <div class="select-group">
            <label for="pathSelect">
                <b>請選擇遊戲路線：</b>
            </label>

            <select id="pathSelect">
                <option value="p1">1. 出埃及記曠野路程</option>
                <option value="p2">2. 保羅宣教之旅</option>
                <option value="p3">3. 亞伯拉罕信心之旅</option>
                <option value="p4">4. 福音書耶穌靴履之旅</option>
            </select>

            <button class="btn-main" onclick="startGame()">
                開始旅程
            </button>
        </div>

    </div>


    <!-- =========================
         GAME
    ========================== -->
    <div id="game-screen" class="hidden">

        <div class="status-bar">

            <div>
                <div>
                    剩餘 Token：
                    <span class="tokens" id="token-count">7</span>
                    🪙
                </div>

                <div class="route-name" id="route-name">
                    路線
                </div>
            </div>

            <button class="btn-reset" onclick="resetGame()">
                重新開始
            </button>

        </div>


        <div class="progress" id="progress">
            <!-- 動態產生 -->
        </div>


        <div class="card">

            <div class="node-number" id="node-number">
                位置 1
            </div>

            <div class="loc-title" id="loc-name">
                起點
            </div>

            <div class="scenario" id="scenario-text">
                情境載入中……
            </div>

            <div class="choice-label">
                你會選擇：
            </div>

            <div class="btn-group" id="action-buttons">
                <!-- 動態產生 -->
            </div>

        </div>

    </div>

</div>

   3: A → 1, B → 5
   4: A → 6, B → 2
   5: A → 8, B → 4
   6: A → 7, B → 4
   7: A → 4, B → 6
   8: A → 1, B → 9
   9: END

   Shortest winning route:

   1 → 3 → 5 → 8 → 9
   B → B → A → B

   4 moves / 5 locations

========================================================= */

                },

                B: {
                    txt: "繞過山坡再向前走",
                    next: 6
                }
            },


            8: {
                name: "客西馬尼園",

                text:
                    "夜色漸深。前面可以直接沿山路進入城區，亦可以繼續向另一邊嘅道路走。",

                A: {
                    txt: "離開山園，沿山路向外走",
                    next: 1
                },

                B: {
                    txt: "沿另一條路繼續向前",
                    next: 9
                }
            },


            9: {
                name: "空墳墓 (主已復活)",

                text:
                    "旅程最後來到空墳墓。你哋完成咗整段旅程！🎉",

                end: true
            }

        }
    }

};


/* =========================================================
   GAME STATE
========================================================= */

let currentPath = null;
let currentPathKey = null;
let currentNode = 1;
let tokens = 7;


/* =========================================================
   START
========================================================= */

function startGame() {

    const selected =
        document.getElementById("pathSelect").value;

    currentPathKey = selected;
    currentPath = gameData[selected];

    document
        .getElementById("setup-screen")
        .classList.add("hidden");

    document
        .getElementById("game-screen")
        .classList.remove("hidden");

    resetGame();
}


/* =========================================================
   RESET
========================================================= */

function resetGame() {

    currentNode = 1;

    tokens =
        currentPath.startToken || 7;

    updateUI();
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const progress =
        document.getElementById("progress");

    progress.innerHTML = "";

    for (let i = 1; i <= 8; i++) {

        const dot =
            document.createElement("div");

        dot.className = "progress-dot";

        if (i < currentNode) {
            dot.classList.add("done");
        }

        progress.appendChild(dot);
    }
}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    const node =
        currentPath.nodes[currentNode];

    document.getElementById("token-count")
        .innerText = tokens;

    document.getElementById("route-name")
        .innerText = currentPath.name;

    document.getElementById("node-number")
        .innerText = "位置 " + currentNode;

    document.getElementById("loc-name")
        .innerText = node.name;

    document.getElementById("scenario-text")
        .innerText = node.text;

    updateProgress();

    const actionBox =
        document.getElementById("action-buttons");


    /* =========================
       END
    ========================== */

    if (node.end) {

        actionBox.innerHTML = `
            <div class="result">

                <div class="result-icon">🎉</div>

                <div class="result-title">
                    成功抵達終點！
                </div>

                <div class="result-text">
                    你哋用咗
                    <b>${currentPath.startToken - tokens}</b>
                    步完成旅程。
                    <br><br>
                    可以再挑戰一次，睇下今次會行邊條路！
                </div>

                <button
                    class="btn-main"
                    onclick="resetGame()">
                    再挑戰一次
                </button>

            </div>
        `;

        return;
    }


    /* =========================
       RANDOMIZE A/B POSITION
    ========================== */

    const choices = [

        {
            key: "A",
            txt: node.A.txt
        },

        {
            key: "B",
            txt: node.B.txt
        }

    ];


    /*
       Randomly swap the physical
       position of A and B.

       Therefore:
       top button ≠ always A
       bottom button ≠ always B
    */

    if (Math.random() < 0.5) {
        choices.reverse();
    }


    actionBox.innerHTML = `

        <button
            class="btn-opt"
            onclick="makeChoice('${choices[0].key}')">

            ${choices[0].txt}

        </button>

        <button
            class="btn-opt alt"
            onclick="makeChoice('${choices[1].key}')">

            ${choices[1].txt}

        </button>

    `;
}


/* =========================================================
   MAKE CHOICE
========================================================= */

function makeChoice(choiceKey) {

    if (tokens <= 0) {
        return;
    }

    const node =
        currentPath.nodes[currentNode];

    const nextNodeId =
        node[choiceKey].next;


    /* Spend one Token */

    tokens--;


    /* ACTUAL MOVEMENT */

    currentNode =
        nextNodeId;


    /* =========================
       SUCCESS
    ========================== */

    if (
        currentPath.nodes[currentNode].end
    ) {

        updateUI();

        setTimeout(() => {

            alert(
                "🎉 恭喜！你哋成功抵達終點！"
            );

        }, 100);

        return;
    }


    /* =========================
       TOKEN USED UP
    ========================== */

    if (tokens === 0) {

        updateUI();

        setTimeout(() => {

            alert(
                "🪙 Token 用盡！\n\n" +
                "你哋仲未到達終點，今次旅程失敗。"
            );

            resetGame();

        }, 100);

        return;
    }


    /* =========================
       CONTINUE
    ========================== */

    updateUI();
}

</script>
