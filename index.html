<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經尋寶大冒險 - 中立戰略版</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .game-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 20px; text-align: center; color: var(--primary); margin-top: 0; }
        .select-group { margin-bottom: 15px; }
        select {
            width: 100%; padding: 12px; font-size: 16px;
            border-radius: 8px; border: 1px solid #ccc; background: #fff;
        }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #eef2f5; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px;
        }
        .tokens { font-size: 18px; font-weight: bold; color: #e74c3c; }
        .card {
            border: 2px solid var(--primary); border-radius: 12px; padding: 15px;
            text-align: center; background: #fff; margin-bottom: 15px;
        }
        .loc-title { font-size: 22px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .scenario { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 15px; text-align: left; }
        .btn-group { display: flex; gap: 10px; flex-direction: column; }
        button {
            padding: 14px; font-size: 15px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .btn-opt { background-color: #3498db; color: white; }
        .btn-opt:nth-child(even) { background-color: #e67e22; }
        .btn-sec { padding: 6px 10px; font-size: 12px; background: #95a5a6; color: #fff; border-radius: 6px; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .nav-buttons { display: flex; gap: 6px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>⛪ 聖經尋寶大冒險</h1>

    <!-- 路線選擇器 -->
    <div class="select-group" id="setup-screen">
        <label for="pathSelect"><b>請選擇遊戲路線：</b></label>
        <select id="pathSelect">
            <option value="p0">0. 新手教學試玩路線 (Tutorial)</option>
            <option value="p1">1. 出埃及記曠野路程 (中立戰略版)</option>
        </select>
        <button class="btn-opt" style="width: 100%; margin-top: 15px;" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 遊戲主介面 -->
    <div id="game-screen" class="hidden">
        <div class="status-bar">
            <div>剩餘 Token：<span class="tokens" id="token-count">7</span> 🪙</div>
            <div class="nav-buttons">
                <button class="btn-sec" onclick="resetGame()">重來</button>
                <button class="btn-sec" style="background:#7f8c8d;" onclick="backToMenu()">換路線</button>
            </div>
        </div>

        <div class="card">
            <div class="loc-title" id="loc-name">起點</div>
            <div class="scenario" id="scenario-text">情境載入中...</div>
            <div class="btn-group" id="action-buttons">
                <!-- 動態生成的按鈕 -->
            </div>
        </div>
    </div>
</div>

<script>
const gameData = {
    p0: {
        name: "新手教學試玩路線",
        startToken: 3,
        nodes: {
            1: { name: "伊甸園", text: "【教學】歡迎來到體驗關卡！每次選擇會消耗 1 粒 Token。請選擇前進方向：", A: { txt: "向東邊河流方向探索", next: 3 }, B: { txt: "向西邊樹林深處探索", next: 2 } },
            2: { name: "迷霧森林", text: "【教學】你走錯路了！這裏會浪費你的 Token，試下退回起點重來。", A: { txt: "返回伊甸園入口", next: 1 }, B: { txt: "繼續在森林原地繞圈", next: 2 } },
            3: { name: "應許之地", text: "【教學】恭喜！你成功抵達終點，體驗完成！", end: true }
        }
    },
    p1: {
        name: "出埃及記曠野路程",
        startToken: 7,
        nodes: {
            1: { name: "蘭塞", text: "夜晚開拔離開奴役之地，面前出現兩條前進路線，隊伍決定採取何種策略？", A: { txt: "沿北方海岸的非利士人道路前進", next: 2 }, B: { txt: "轉向東南方的曠野紅海路前進", next: 3 } },
            2: { name: "比哈希錄", text: "隊伍抵達海邊狹角，後方探報發現埃及戰車隊追至，應如何處置？", A: { txt: "駐紮海邊，全軍就地整頓", next: 3 }, B: { txt: "沿峭壁旁狹窄沙洲向南急行軍", next: 4 } },
            3: { name: "瑪拉", text: "抵達水泉發現水質苦澀無法飲用，隊伍士氣受挫，後勤如何應對？", A: { txt: "派後勤隊折返尋找舊水源", next: 1 }, B: { txt: "將當地的樹木扔進水泉淨化", next: 5 } },
            4: { name: "訊曠野", text: "走入地貌複雜的岩石荒野，糧食儲備大幅下降，隊伍如何選擇路徑？", A: { txt: "攀越地勢崎嶇的石灰岩山谷", next: 6 }, B: { txt: "順著乾涸河床退回水泉區域", next: 2 } },
            5: { name: "利非訂", text: "遭遇亞瑪力人突襲，敵軍切斷了隊伍的補給線，指揮官如何下達指令？", A: { txt: "部署先鋒隊交戰，並在山頂建立指揮哨", next: 8 }, B: { txt: "派出斥候向南方沙漠平原尋求繞道", next: 4 } },
            6: { name: "基博羅哈他瓦", text: "陣營捕獲大批季候風吹來的野生鵪鶉，全軍面臨衛生與分配問題，應如何處置？", A: { txt: "允許各家族即時自行儲糧與烹煮", next: 7 }, B: { txt: "設立中央分配點，清點人數後開拔", next: 4 } },
            7: { name: "哈洗錄", text: "內部意見分歧，高空出現強烈沙塵暴導致視野極低，全軍應如何決定？", A: { txt: "宣布全軍在營外原地駐紮等待沙暴過去", next: 4 }, B: { txt: "嘗試以隊形強行穿過山林區域", next: 6 } },
            8: { name: "加低斯巴尼亞", text: "探子帶回地理回報，北方原住民城牆高大且防守嚴密，軍事會議如何決策？", A: { txt: "鑑於兵力差距，建議主力回撤南方曠野", next: 1 }, B: { txt: "保持陣型，即時集結部隊越過山地邊界", next: 9 } },
            9: { name: "迦南應許之地", text: "恭喜！隊伍成功進入目的地！🎉", end: true }
        }
    }
};

let currentPath = null;
let currentNode = 1;
let tokens = 7;

function startGame() {
    const selected = document.getElementById('pathSelect').value;
    currentPath = gameData[selected];
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    resetGame();
}

function resetGame() {
    currentNode = 1;
    tokens = currentPath.startToken || 7;
    updateUI();
}

function backToMenu() {
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
}

function updateUI() {
    const node = currentPath.nodes[currentNode];
    document.getElementById('token-count').innerText = tokens;
    document.getElementById('loc-name').innerText = node.name;
    document.getElementById('scenario-text').innerText = node.text;

    const actionBox = document.getElementById('action-buttons');
    if (node.end) {
        actionBox.innerHTML = `
            <button class="btn-opt" style="width:100%" onclick="resetGame()">重新挑戰本路線</button>
            <button class="btn-opt" style="width:100%; background:#7f8c8d;" onclick="backToMenu()">返回路線選單</button>
        `;
    } else {
        const choices = [
            { key: 'A', txt: node.A.txt },
            { key: 'B', txt: node.B.txt }
        ];
        if (Math.random() < 0.5) {
            choices.reverse();
        }

        actionBox.innerHTML = `
            <button class="btn-opt" onclick="makeChoice('${choices[0].key}')">${choices[0].txt}</button>
            <button class="btn-opt" onclick="makeChoice('${choices[1].key}')">${choices[1].txt}</button>
        `;
    }
}

function makeChoice(choiceKey) {
    if (tokens <= 0) return;

    const node = currentPath.nodes[currentNode];
    const nextNodeId = node[choiceKey].next;
    
    tokens--;
    currentNode = nextNodeId;

    if (currentPath.nodes[currentNode].end) {
        updateUI();
        alert("🎉 恭喜！成功抵達終點！");
    } else if (tokens === 0) {
        updateUI();
        alert("🪙 Token 用盡，喺旅途中迷路！即將重頭開始本路線。");
        resetGame();
    } else {
        updateUI();
    }
}
</script>

</body>
</html>
