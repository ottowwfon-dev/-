<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歡迎頁面</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --info: #3498db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center;
            min-height: 98vh; box-sizing: border-box;
        }
        .container {
            width: 100%; max-width: 450px;
            background: var(--card-bg); border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 25px 20px; box-sizing: border-box; text-align: center;
        }
        h1 { font-size: 22px; color: var(--primary); margin-top: 0; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 25px; }
        .card {
            border: 2px solid var(--primary); border-radius: 12px;
            padding: 20px 15px; background: #fff; margin-bottom: 10px;
        }
        .btn-demo {
            padding: 16px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 10px; cursor: pointer; transition: 0.15s;
            background-color: var(--info); color: white;
            text-decoration: none; display: block;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        .btn-demo:active { transform: scale(0.97); opacity: 0.9; }
        .notice {
            font-size: 13px; color: #e67e22; margin-top: 15px; line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⛪ 聖經尋寶大冒險</h1>
    <div class="subtitle">特別企劃</div>

    <div class="card">
        <p style="font-size: 15px; color: #444; line-height: 1.6; margin-top: 0;">
            請點擊下方按鈕進入 Demo 試玩版：
        </p>

        <a href="demo.html" class="btn-demo">🎮 進入 Demo 示範版</a>

        <div class="notice">
            📌 正式版遊戲連結將於試玩環節結束後，於 WhatsApp 群組內公佈。
        </div>
    </div>
</div>

</body>
</html>
